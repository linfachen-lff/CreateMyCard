<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search 检索链路 Demo</title>
  <style>
    :root { color-scheme: dark; --bg:#09111f; --panel:#111d30; --line:#2b3a52; --muted:#91a1b8; --blue:#62a8ff; --green:#56d6a0; --amber:#ffcb6b; --red:#ff7885; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; color:#eef4ff; background:radial-gradient(circle at 15% 0,#172b4d 0,transparent 34%),var(--bg); }
    main { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:42px 0 64px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:26px; }
    h1 { margin:0; font-size:clamp(25px,4vw,42px); letter-spacing:-.03em; }
    header p { margin:7px 0 0; color:var(--muted); }
    .badge { padding:7px 11px; border:1px solid var(--line); border-radius:999px; color:var(--green); background:#10261f; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:minmax(320px,.85fr) minmax(420px,1.15fr); gap:18px; }
    .panel { border:1px solid var(--line); border-radius:18px; padding:20px; background:color-mix(in srgb,var(--panel) 92%,transparent); box-shadow:0 18px 50px #0004; }
    h2 { margin:0 0 16px; font-size:16px; }
    label { display:block; margin:14px 0 7px; color:#c8d4e7; font-weight:650; }
    input,textarea { width:100%; color:#eef4ff; background:#091424; border:1px solid #30425e; border-radius:10px; padding:11px 12px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; outline:none; }
    input:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #62a8ff20; }
    textarea { min-height:205px; resize:vertical; }
    .hint { color:var(--muted); font-size:12px; margin-top:7px; }
    .actions { display:flex; gap:9px; margin-top:16px; }
    button { border:0; border-radius:10px; padding:10px 15px; cursor:pointer; font-weight:750; color:#07101e; background:var(--blue); }
    button.secondary { color:#c9d6e9; background:#24344c; }
    button:disabled { opacity:.55; cursor:wait; }
    .flow { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
    .step { position:relative; min-height:74px; padding:11px; border:1px solid var(--line); border-radius:11px; color:var(--muted); background:#0c1728; }
    .step:not(:last-child)::after { content:"›"; position:absolute; right:-8px; top:23px; z-index:2; color:#6c7d96; font-size:25px; }
    .step strong { display:block; color:#dbe6f6; margin-bottom:3px; }
    .step.active { border-color:var(--blue); background:#122b4d; box-shadow:inset 0 0 0 1px #62a8ff35; }
    .step.done { border-color:#287859; background:#10261f; }
    .route { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:46px; margin-bottom:12px; padding:10px 13px; border:1px solid var(--line); border-radius:10px; background:#0b1626; }
    .route span { color:var(--muted); }
    .outcome { font:750 13px ui-monospace,monospace; color:var(--amber); }
    pre { margin:0; min-height:310px; max-height:470px; overflow:auto; padding:15px; border-radius:11px; color:#c9d8ed; background:#07101c; border:1px solid #23334b; white-space:pre-wrap; word-break:break-word; }
    .material { margin-bottom:12px; padding:14px; border:1px solid #314a69; border-radius:11px; background:#0c1b2d; }
    .material[hidden] { display:none; }
    .material-head { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; }
    .material-head strong { color:var(--green); font-size:13px; }
    .description { margin:10px 0; color:#dce7f7; white-space:pre-wrap; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { padding:3px 8px; border-radius:999px; color:#bcd7ff; background:#173353; font-size:12px; }
    .error { color:var(--red); }
    @media (max-width:820px) { header { align-items:start; flex-direction:column; } .layout { grid-template-columns:1fr; } .flow { grid-template-columns:1fr 1fr; } .step:not(:last-child)::after { display:none; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>Search 检索链路</h1><p>可观察载荷结构 Hash 优先，未命中后才进入关键词检索。</p></div><div class="badge">本地 SQLite · 不调用模型</div></header>
  <div class="layout">
    <section class="panel">
      <h2>请求输入</h2>
      <label for="query">自然语言 query（可选）</label>
      <input id="query" value="空气质量" placeholder="例如：生成一个空气质量卡片">
      <label for="inputData">完整 MCP JSON（可选）</label>
      <textarea id="inputData" spellcheck="false" placeholder='例如：{"weather":{"city":"深圳","temperature":28}}'></textarea>
      <div class="hint">两者至少填写一个；同时填写时先计算完整 inputData 的结构 Hash。</div>
      <div class="actions"><button id="submit">执行检索</button><button class="secondary" id="clear">清空</button></div>
    </section>
    <section class="panel">
      <h2>路由与结果</h2>
      <div class="flow">
        <div class="step" data-step="request"><strong>1 请求</strong>query / inputData</div>
        <div class="step" data-step="hash"><strong>2 结构 Hash</strong>完整可观察载荷</div>
        <div class="step" data-step="keyword"><strong>3 关键词回退</strong>FTS5 · BM25 · 覆盖率</div>
        <div class="step" data-step="route"><strong>4 上层路由</strong>渲染或生成模式</div>
      </div>
      <div class="route"><span id="routeText">等待请求</span><strong class="outcome" id="outcome">—</strong></div>
      <article class="material" id="material" hidden>
        <div class="material-head"><strong>命中素材 · 原始 description</strong><span id="materialId"></span></div>
        <div class="description" id="description"></div><div class="tags" id="tags"></div>
      </article>
      <pre id="result">点击“执行检索”查看 SearchResult。</pre>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const steps = [...document.querySelectorAll('.step')];
  function paint(names) { steps.forEach((el) => el.className = 'step' + (names.includes(el.dataset.step) ? ' done' : '')); }
  function routeText(result) {
    if (result.outcome === 'structure_match') return 'rendered_jsonl → 直接渲染';
    if (result.outcome === 'keyword_match') return 'reference_jsonl → 带少样本示例的生成模式';
    return `无模板输出 → 不带少样本示例的生成模式（${result.miss_reason}）`;
  }
  $('clear').onclick = () => { $('query').value=''; $('inputData').value=''; $('result').textContent='点击“执行检索”查看 SearchResult。'; $('outcome').textContent='—'; $('routeText').textContent='等待请求'; $('material').hidden=true; paint([]); };
  $('submit').onclick = async () => {
    const button = $('submit'); const raw = $('inputData').value.trim();
    let inputData = null;
    try { if (raw) inputData = JSON.parse(raw); }
    catch (error) { $('result').innerHTML = `<span class="error">inputData 不是合法 JSON：${error.message}</span>`; return; }
    const body = { query: $('query').value, inputData };
    button.disabled=true; paint(['request']); $('outcome').textContent='RUNNING'; $('routeText').textContent='正在检索…';
    try {
      const response = await fetch('/api/search', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const payload = await response.json();
      if (!response.ok) throw new Error(`${payload.error?.code || response.status}: ${payload.error?.message || '请求失败'}`);
      const result = payload.search_result;
      const completed=['request']; if (inputData) completed.push('hash'); if (result.outcome !== 'structure_match' && body.query.trim()) completed.push('keyword'); completed.push('route'); paint(completed);
      $('outcome').textContent=result.outcome; $('routeText').textContent=routeText(result); $('result').textContent=JSON.stringify(result,null,2);
      $('material').hidden=!payload.material;
      if (payload.material) { $('materialId').textContent=payload.material.template_id; $('description').textContent=payload.material.description; $('tags').innerHTML=payload.material.tags.map((tag) => `<span class="tag">${tag.replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>`).join(''); }
    } catch (error) { $('outcome').textContent='ERROR'; $('routeText').textContent='请求边界拒绝'; $('result').textContent=error.message; $('result').classList.add('error'); }
    finally { button.disabled=false; }
  };
</script>
</body>
</html>
